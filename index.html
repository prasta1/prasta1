<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patrick Ruster</title>
  <meta name="description" content="Patrick Ruster — Three-Time Founding CS Leader. Cambridge, Vermont. AI · ML · Enterprise SaaS." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Lora', Georgia, serif; background: #f6f6f6; color: #1f261f; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    .reveal { opacity: 0; transform: translateY(14px); transition: opacity 0.8s cubic-bezier(0.19,1,0.22,1), transform 0.8s cubic-bezier(0.19,1,0.22,1); }
    .reveal.in { opacity: 1; transform: none; }
    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-thumb { background: rgba(31,38,31,.18); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const EASE  = 'cubic-bezier(0.19, 1, 0.22, 1)';
const SERIF = "'Lora', Georgia, serif";
const MONO  = "'DM Mono', 'Courier New', monospace";
const C = { dark:'#1f261f', light:'#f6f6f6', parch:'#e4e1db', accent:'#a8dfbc', muted:'#798b81', ink:'#3d4d3d' };

const tk = (dark) => ({
  heading: dark ? C.light : C.dark,
  body:    dark ? 'rgba(246,246,246,0.56)' : C.ink,
  muted:   dark ? 'rgba(246,246,246,0.42)' : C.muted,
  border:  dark ? 'rgba(246,246,246,0.12)' : 'rgba(31,38,31,0.12)',
  chip:    dark ? 'rgba(246,246,246,0.20)' : 'rgba(31,38,31,0.18)',
});

function Band({ bg, children, pad }) {
  return (
    <div style={{ background: bg, width: '100%' }}>
      <div style={{ maxWidth: 760, margin: '0 auto', padding: pad || '0 32px' }}>{children}</div>
    </div>
  );
}

const experience = [
  { years: '2023 — Present', role: 'Head of Global Customer Success', co: 'Qualcomm / Edge Impulse', sub: 'Acquired by Qualcomm',
    metrics: ['101% NRR', '93% logo retention', '$2M ARR'],
    bullets: [
      'Built the Global CS function from scratch as the first CS hire — team structure, hiring, onboarding playbooks, health scoring, escalation protocols.',
      'Built customer analytics infrastructure in Amplitude for data-driven health scoring and proactive churn identification.',
      'Expanded scope post-acquisition to new logo acquisition and direct quota, bridging CS and Account Management within Qualcomm\'s IoT framework.',
    ] },
  { years: '2021 — 2022', role: 'Senior Enterprise Customer Success Manager', co: 'Sama',
    metrics: ['129% NRR', '90% logo retention', '$8M ARR'],
    bullets: [
      'Owned the company\'s most strategic relationships — two accounts representing 87% of portfolio ARR, with executive engagement and zero margin for error.',
      'Managed full lifecycle from onboarding through renewal and expansion via joint success plans tied to business objectives.',
    ] },
  { years: '2019 — 2021', role: 'Senior Strategic Customer Success Manager', co: 'Faraday',
    metrics: ['96% → 119% NRR'],
    bullets: [
      'Led 4 Commercial CSMs as player/coach while managing strategic accounts and serving as escalation point.',
      'Built trusted-advisor relationships with executive sponsors, translating predictive analytics into business value.',
    ] },
  { years: '2018 — 2019', role: 'Team Lead, Customer Success', co: 'DataRobot',
    metrics: ['160% → 189% NRR', '100% logo retention'],
    bullets: [
      'Founding CS team member at an AI/ML platform — built the playbooks, frameworks, and success metrics the team scaled on.',
      'Led CSMs as player/coach while carrying a book; built feedback loops across NPS, health data, and usage analytics.',
    ] },
  { years: '2015 — 2018', role: 'Team Lead, Account Management', co: 'CarGurus',
    metrics: ['134% to quota', '$1.5M ARR'],
    bullets: [
      'Led 4 Account Managers as player/coach while owning a strategic portfolio.',
      'Built IFTTT automations for brand monitoring and scalable lifecycle engagement.',
    ] },
];

const making = [
  { t: 'CNC Woodworking', d: 'Precision-routed parts, furniture components, and decorative pieces.' },
  { t: 'Laser Cutting & Engraving', d: 'Flat-pack assemblies through fine-detail engraving on wood, acrylic, and leather.' },
  { t: '3D Printing', d: 'Functional prototypes and custom hardware — designed in Fusion 360, printed in-house.' },
];

const projects = [
  { t: 'Edge AI experiments', d: 'Embedded ML tinkering, building on learnings from Edge Impulse.' },
  { t: 'CNC design library', d: 'Parametric Fusion 360 models for shop fixtures, jigs, and repeatable parts.' },
  { t: 'CS tooling & automations', d: 'Scripts, dashboards, and data tools to streamline customer success workflows.' },
];

const certs = ['Edge AI Certified', 'Amplitude Foundations', 'SuccessHacker L1 & L2', 'HubSpot Inbound', 'Google Ads & Analytics'];
const links = [
  { label: 'Apps', href: 'apps.html' },
  { label: 'LinkedIn', href: 'https://linkedin.com/in/pruster' },
  { label: 'GitHub', href: 'https://github.com/prasta1' },
  { label: 'Email', href: 'mailto:ruster.patrick@gmail.com' },
];

function Label({ children, style }) {
  return <p style={{ fontFamily: MONO, fontSize: 11, fontWeight: 400, letterSpacing: '0.14em', textTransform: 'uppercase', color: C.muted, ...style }}>{children}</p>;
}

function InlineLink({ href, children, dark }) {
  const [hov, setHov] = useState(false);
  const base = dark ? 'rgba(246,246,246,0.55)' : C.muted;
  const on   = dark ? C.accent : C.dark;
  return (
    <a href={href} target={href && href.startsWith('http') ? '_blank' : undefined} rel="noopener"
       onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
       style={{ fontFamily: MONO, fontSize: 12, letterSpacing: '0.04em', color: hov ? on : base, borderBottom: `1px solid ${hov ? on : (dark ? 'rgba(246,246,246,0.25)' : 'rgba(121,139,129,0.35)')}`, paddingBottom: 1, transition: `color 0.5s ${EASE}, border-color 0.5s ${EASE}` }}>{children}</a>
  );
}

function Section({ id, label, children, dark }) {
  return (
    <section id={id} className="reveal">
      <Label style={{ marginBottom: 28, display: 'flex', alignItems: 'center', gap: 14, color: dark ? 'rgba(246,246,246,0.5)' : C.muted }}>
        <span style={{ width: 18, height: 1, background: C.accent, display: 'inline-block' }} />{label}
      </Label>
      {children}
    </section>
  );
}

function ExpRow({ job, last, compact, dark }) {
  const [hov, setHov] = useState(false);
  const T = tk(dark);
  const metricText = dark ? (hov ? C.dark : 'rgba(246,246,246,0.7)') : C.ink;
  return (
    <div onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
         style={{ display: 'grid', gridTemplateColumns: '110px 1fr', gap: 28, padding: '26px 0', borderTop: `1px solid ${T.border}`, ...(last ? { borderBottom: `1px solid ${T.border}` } : {}) }}>
      <p style={{ fontFamily: MONO, fontSize: 11, letterSpacing: '0.03em', color: hov ? T.heading : T.muted, paddingTop: 5, transition: `color 0.5s ${EASE}` }}>{job.years}</p>
      <div>
        <h3 style={{ fontFamily: SERIF, fontSize: 19, fontWeight: 500, color: T.heading, lineHeight: 1.35 }}>{job.role}</h3>
        <p style={{ fontFamily: SERIF, fontStyle: 'italic', fontSize: 15, color: T.muted, marginTop: 2, marginBottom: 14 }}>{job.co}{job.sub ? ` · ${job.sub}` : ''}</p>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7, marginBottom: compact ? 0 : 16 }}>
          {job.metrics.map(m => <span key={m} style={{ fontFamily: MONO, fontSize: 10.5, letterSpacing: '0.04em', padding: '3px 11px', borderRadius: 1000, color: metricText, background: hov ? C.accent : 'transparent', border: `1px solid ${hov ? C.accent : (dark ? 'rgba(246,246,246,0.30)' : C.muted)}`, transition: `background 0.5s ${EASE}, border-color 0.5s ${EASE}, color 0.5s ${EASE}` }}>{m}</span>)}
        </div>
        {!compact && (
          <ul style={{ listStyle: 'none', display: 'flex', flexDirection: 'column', gap: 8 }}>
            {job.bullets.map((b, i) => (
              <li key={i} style={{ fontFamily: SERIF, fontSize: 14.5, lineHeight: 1.65, color: T.body, paddingLeft: 16, position: 'relative' }}>
                <span style={{ position: 'absolute', left: 0, top: 9, width: 5, height: 5, borderRadius: '50%', background: C.accent }} />{b}
              </li>
            ))}
          </ul>
        )}
      </div>
    </div>
  );
}

function ListItem({ t, d, last, dark }) {
  const [hov, setHov] = useState(false);
  const T = tk(dark);
  return (
    <div onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
         style={{ display: 'grid', gridTemplateColumns: '110px 1fr', gap: 28, padding: '20px 0', borderTop: `1px solid ${T.border}`, ...(last ? { borderBottom: `1px solid ${T.border}` } : {}) }}>
      <h3 style={{ fontFamily: SERIF, fontSize: 15, fontWeight: 500, color: hov ? T.heading : T.muted, lineHeight: 1.35, transition: `color 0.5s ${EASE}` }}>{t}</h3>
      <p style={{ fontFamily: SERIF, fontSize: 14.5, lineHeight: 1.65, color: T.body }}>{d}</p>
    </div>
  );
}

function App() {
  useEffect(() => {
    const timer = setTimeout(() => {
      const obs = new IntersectionObserver(
        es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } }),
        { threshold: 0.04, rootMargin: '0px 0px -30px 0px' });
      document.querySelectorAll('.reveal').forEach(el => { el.classList.remove('in'); obs.observe(el); });
      return () => obs.disconnect();
    }, 100);
    return () => clearTimeout(timer);
  }, []);

  return (
    <div>
      <Band bg={C.dark} pad="0 32px 72px">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '28px 0' }}>
          <span style={{ fontFamily: SERIF, fontSize: 17, fontWeight: 500, color: C.light }}>Patrick Ruster</span>
          <div style={{ display: 'flex', gap: 20 }}>
            {links.map(l => <InlineLink key={l.label} href={l.href} dark>{l.label}</InlineLink>)}
          </div>
        </div>

        <header className="reveal in" style={{ paddingTop: 48, display: 'flex', gap: 36, alignItems: 'center', flexWrap: 'wrap' }}>
          <div style={{ flex: 1, minWidth: 280 }}>
            <h1 style={{ fontFamily: SERIF, fontSize: 'clamp(2.6rem, 6vw, 3.6rem)', fontWeight: 400, lineHeight: 1.05, letterSpacing: '-0.01em', color: C.light }}>Patrick <em style={{ color: C.accent }}>Ruster</em></h1>
            <p style={{ fontFamily: MONO, fontSize: 13, letterSpacing: '0.10em', textTransform: 'uppercase', color: 'rgba(246,246,246,0.75)', marginTop: 18 }}>Three-Time Founding CS Leader</p>
            <p style={{ fontFamily: MONO, fontSize: 12, letterSpacing: '0.04em', color: 'rgba(246,246,246,0.42)', marginTop: 8 }}>Cambridge, Vermont · AI · ML · Enterprise SaaS</p>
          </div>
        </header>

        <p className="reveal" style={{ fontFamily: SERIF, fontSize: 19, lineHeight: 1.7, color: 'rgba(246,246,246,0.62)', marginTop: 40, maxWidth: 620 }}>
          I build customer success from zero — the motion, the team, and the tooling that scale a business. Equal parts strategist and operator. Off the clock, I'm in the shop running CNC, laser, and 3D printers; same instincts, different material.
        </p>
      </Band>

      <Band bg={C.light} pad="72px 32px">
        <Section id="experience" label="Experience">
          {experience.map((j, i) => <ExpRow key={i} job={j} last={i === experience.length - 1} compact={false} />)}
          <p style={{ fontFamily: SERIF, fontStyle: 'italic', fontSize: 13.5, color: C.muted, marginTop: 22 }}>Earlier: finance roles at John Hancock Financial Services and State Street Global Advisors.</p>
        </Section>
      </Band>

      <Band bg={C.parch} pad="72px 32px">
        <Section id="making" label="In the Shop">
          {making.map((m, i) => <ListItem key={i} t={m.t} d={m.d} last={i === making.length - 1} />)}
          <p style={{ fontFamily: MONO, fontSize: 10.5, letterSpacing: '0.10em', textTransform: 'uppercase', color: C.muted, marginTop: 18 }}>Designed in Autodesk Fusion 360</p>
        </Section>
      </Band>

      <Band bg={C.light} pad="72px 32px">
        <Section id="projects" label="Side Projects">
          {projects.map((p, i) => <ListItem key={i} t={p.t} d={p.d} last={i === projects.length - 1} />)}
        </Section>
      </Band>

      <Band bg={C.parch} pad="72px 32px">
        <Section id="credentials" label="Education & Credentials">
          <div style={{ display: 'grid', gridTemplateColumns: '110px 1fr', gap: 28 }}>
            <h3 style={{ fontFamily: SERIF, fontSize: 15, fontWeight: 500, color: C.muted, lineHeight: 1.35 }}>SUNY Plattsburgh</h3>
            <div>
              <p style={{ fontFamily: SERIF, fontSize: 15, color: C.dark }}>B.S. Business Administration <span style={{ fontStyle: 'italic', color: C.muted }}>· Minor in Environmental Science</span></p>
              <p style={{ fontFamily: MONO, fontSize: 11, color: C.muted, letterSpacing: '0.03em', marginTop: 8 }}>President, AMA Chapter · Captain, Men's Lacrosse</p>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7, marginTop: 18 }}>
                {certs.map(c => <span key={c} style={{ fontFamily: MONO, fontSize: 10.5, letterSpacing: '0.03em', padding: '4px 12px', border: `1px solid rgba(31,38,31,0.18)`, borderRadius: 1000, color: C.ink }}>{c}</span>)}
              </div>
            </div>
          </div>
        </Section>
      </Band>

      <Band bg={C.dark} pad="72px 32px 32px">
        <Section id="contact" label="Collaborate" dark>
          <h2 style={{ fontFamily: SERIF, fontSize: 28, fontWeight: 400, lineHeight: 1.3, color: C.light, maxWidth: 540 }}>Open to conversations about customer success, edge AI, fabrication, or anything in <em style={{ color: C.accent }}>between.</em></h2>
          <div style={{ display: 'flex', gap: 14, marginTop: 28, flexWrap: 'wrap' }}>
            {links.map(l => <CTA key={l.label} href={l.href} dark>{l.label}</CTA>)}
          </div>
        </Section>
        <footer style={{ marginTop: 64, paddingTop: 24, borderTop: '1px solid rgba(246,246,246,0.12)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 }}>
          <span style={{ fontFamily: MONO, fontSize: 10.5, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'rgba(246,246,246,0.3)' }}>Patrick Ruster — Cambridge, VT</span>
          <span style={{ fontFamily: SERIF, fontStyle: 'italic', fontSize: 13, color: 'rgba(246,246,246,0.3)' }}>Designed to last. Built by hand.</span>
        </footer>
      </Band>
    </div>
  );
}

function CTA({ href, children, dark }) {
  const [hov, setHov] = useState(false);
  const rest = dark ? 'rgba(246,246,246,0.30)' : C.dark;
  const txt  = dark ? (hov ? C.dark : C.light) : C.dark;
  return (
    <a href={href} target={href && href.startsWith('http') ? '_blank' : undefined} rel="noopener"
       onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
       style={{ fontFamily: MONO, fontSize: 13, fontWeight: 300, letterSpacing: '0.06em', padding: '10px 26px', minHeight: 44, display: 'inline-flex', alignItems: 'center', borderRadius: 1000, border: `1px solid ${hov ? C.accent : rest}`, background: hov ? C.accent : 'transparent', color: txt, transition: `background 0.6s ${EASE}, border-color 0.6s ${EASE}, color 0.6s ${EASE}` }}>{children}</a>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
